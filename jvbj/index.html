<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ==============================================================
       EDIT YOUR BADGES HERE. Order in this list = order on the page.
       Built-in icons: premium, verified, staff, og, donor, booster,
       developer, gift, bug, star, heart, image-host.
       Custom image: { label: "My badge", image: "assets/badges/my.png" }
       Optional: color: "#a78bfa", url: "https://example.com"
       Remove every badge by setting BADGES = [].
       ============================================================== -->
  <script>
    const BADGES = [
      { icon: "premium", label: "Premium" },
      { icon: "verified", label: "Verified" },
      { icon: "developer", label: "Developer" },
      // { image: "assets/badges/custom.png", label: "Custom badge" },
    ];

    const PROFILE = {
      // Drop your files into jvbj/assets/. No build step needed.
      nameFile: "assets/name.txt",
      fallbackName: "jvbj",
      avatar: "assets/avatar.png", // PNG, JPG, WEBP, GIF, or SVG
      backgroundVideo: "assets/background.mp4", // MP4 or WEBM; "" disables video
      backgroundImage: "assets/background.svg", // Fallback / image-only background
      audio: "", // Optional, e.g. "assets/audio.mp3"

      bio: ["welcome to my page", "somewhere on the internet"],
      typewriter: true,
      location: "", // Optional; leave empty to hide
      uid: "", // Optional tooltip on your name
      views: 0, // Editable display value; null hides it. See README for analytics.
      enterText: "click to enter...",
      volume: 0.35,
      startMuted: false,
      accent: "#fafafa",
      cardOpacity: 0.48,
      cardBlur: 14,
      cardRadius: 20,
      particles: true,
      tilt: true,

      // Static example until you add a Discord ID. Set enabled: false to hide.
      // Optional live presence uses the public Lanyard API (see README).
      discord: {
        enabled: true,
        userId: "",
        username: "", // Empty = use assets/name.txt
        avatar: "", // Empty = use the main avatar
        status: "offline", // online, idle, dnd, offline
        activity: "Offline",
        url: "", // Optional Discord profile / invite URL
      },

      // Replace these platform homepages with your own profile URLs.
      // You can also use { icon: "discord", label: "Discord", copy: "username" }.
      links: [
        { icon: "discord", label: "Discord", url: "https://discord.com/" },
        { icon: "github", label: "GitHub", url: "https://github.com/" },
        { icon: "spotify", label: "Spotify", url: "https://open.spotify.com/" },
        { icon: "youtube", label: "YouTube", url: "https://www.youtube.com/" },
        { icon: "instagram", label: "Instagram", url: "https://www.instagram.com/" },
        { icon: "globe", label: "Website", url: "https://onimai.site/" },
      ],
    };
  </script>

  <title>jvbj</title>
  <meta name="description" content="welcome to my page">
  <meta name="theme-color" content="#08090b">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="jvbj">
  <meta property="og:description" content="welcome to my page">
  <link rel="icon" href="assets/avatar.png">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&amp;display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="profile.js" defer></script>
</head>
<body>
  <div class="background" aria-hidden="true">
    <div id="backgroundImage" class="background-image"></div>
    <video id="backgroundVideo" class="background-video" muted loop playsinline preload="auto" poster="assets/background.svg"></video>
    <div class="background-shade"></div>
    <div id="particles" class="particles"></div>
  </div>

  <button id="entryGate" class="entry-gate" type="button" autofocus>
    <span id="enterText">click to enter...</span>
  </button>

  <div id="page" class="page" inert aria-hidden="true">
    <div class="volume-control">
      <button id="muteButton" class="control-button" type="button" aria-label="Mute audio" aria-pressed="false"></button>
      <div class="volume-slider">
        <input id="volume" type="range" min="0" max="100" value="35" aria-label="Audio volume">
      </div>
    </div>
    <button id="motionButton" class="control-button motion-button" type="button" aria-label="Pause background" aria-pressed="false"></button>

    <main class="profile-stage">
      <article id="profileCard" class="profile-card" aria-label="Bio profile">
        <img id="avatar" class="avatar" src="assets/avatar.png" alt="Profile picture" width="120" height="120" fetchpriority="high">

        <div class="identity">
          <h1 id="displayName" class="display-name">jvbj</h1>
          <div id="badges" class="badges" aria-label="Profile badges"></div>
        </div>

        <p id="bio" class="bio"><span id="bioText">welcome to my page</span><span id="typeCursor" class="type-cursor" aria-hidden="true">|</span></p>
        <p id="location" class="location" hidden></p>

        <div id="discordPresence" class="discord-presence" hidden>
          <div class="discord-avatar-wrap">
            <img id="discordAvatar" class="discord-avatar" src="assets/avatar.png" alt="" width="56" height="56">
            <span id="discordStatus" class="status-dot offline" role="img" aria-label="Offline"></span>
          </div>
          <div class="discord-info">
            <span id="discordUsername" class="discord-username">jvbj</span>
            <span id="discordActivity" class="discord-activity">Offline</span>
          </div>
          <span id="discordLogo" class="discord-logo" aria-hidden="true"></span>
        </div>

        <nav id="socialLinks" class="social-links" aria-label="Social links"></nav>

        <div id="profileViews" class="profile-views" tabindex="0" data-tooltip="Profile views" aria-label="Profile views">
          <span id="viewsIcon" aria-hidden="true"></span><span id="viewsCount">0</span>
        </div>
      </article>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">Enable JavaScript to open this profile.</p></noscript>
</body>
</html>
